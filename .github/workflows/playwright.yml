name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      # 1. Check out THIS repo (the test code)
      - name: Checkout test repo
        uses: actions/checkout@v4

      # 2. Check out the APP repo into ./app/
      - name: Checkout app repo
        uses: actions/checkout@v4
        with:
          repository: forgestack/auth-ui
          token: ${{ secrets.APP_REPO_PAT }}
          path: app

      # 3. Node.js setup WITH npm caching (caches downloaded packages)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json

      # 4. Install test dependencies
      - name: Install test dependencies
        run: npm ci

      # 5. Install app dependencies
      - name: Install app dependencies
        working-directory: ./app
        run: npm ci

      # 6. Restore the Playwright image tarball from cache (if it exists)
      - name: Cache Playwright image
        id: playwright-image-cache
        uses: actions/cache@v4
        with:
          path: /tmp/playwright-image.tar
          key: playwright-image-v1.59.1-noble

      # 7. Load image from cache, or pull it fresh and save for next time
      - name: Load or pull Playwright image
        run: |
          if [ -f /tmp/playwright-image.tar ]; then
            echo "Cache hit. Loading image from tarball."
            docker load -i /tmp/playwright-image.tar
          else
            echo "Cache miss. Pulling image and saving to tarball."
            docker pull mcr.microsoft.com/playwright:v1.59.1-noble
            docker save mcr.microsoft.com/playwright:v1.59.1-noble -o /tmp/playwright-image.tar
          fi

      # 8. Start app in background, wait for it to respond
      - name: Start app
        working-directory: ./app
        run: |
          npm run dev &
          npx wait-on http://localhost:3000 --timeout 90000

      # 9. Run tests inside the Playwright Docker container
      - name: Run tests in Docker
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/work \
            -w /work \
            --network=host \
            --ipc=host \
            mcr.microsoft.com/playwright:v1.59.1-noble \
            npx playwright test

      # 10. Upload HTML report
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # 11. Upload raw test artifacts
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7