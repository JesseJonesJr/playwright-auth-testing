name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      # 1. Check out THIS repo (the test code)
      - name: Checkout test repo
        uses: actions/checkout@v4

      # 2. Check out the APP repo into ./app/, using the PAT secret
      - name: Checkout app repo
        uses: actions/checkout@v4
        with:
          repository: forgestack/auth-ui
          token: ${{ secrets.APP_REPO_PAT }}
          path: app

      # 3. Node.js setup
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 4. Install test dependencies (Playwright, etc.)
      - name: Install test dependencies
        run: npm ci

      # 5. Install Playwright browsers + Linux system deps
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      # 6. Install app dependencies
      - name: Install app dependencies
        working-directory: ./app
        run: npm ci

      # 7. Start app in background, wait for it to respond.
      #    Assumes you run `npm run dev` locally. If you run the production
      #    build instead, swap the command for: npm run build && npm run start &
      - name: Start app
        working-directory: ./app
        run: |
          npm run dev &
          npx wait-on http://localhost:3000 --timeout 90000

      # 8. Run the tests
      - name: Run Playwright tests
        run: npx playwright test

      # 9. Upload HTML report (even on failure — especially on failure)
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
