name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      # 1. Check out THIS repo (the test code)
      - name: Checkout test repo
        uses: actions/checkout@v4

      # 2. Check out the APP repo into ./app/
      - name: Checkout app repo
        uses: actions/checkout@v4
        with:
          repository: forgestack/auth-ui
          token: ${{ secrets.APP_REPO_PAT }}
          path: app

      # 3. Node.js setup with npm caching
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json

      # 4. Install test dependencies
      - name: Install test dependencies
        run: npm ci

      # 5. Install app dependencies
      - name: Install app dependencies
        working-directory: ./app
        run: npm ci

      # 6. Start app in background, wait for it to respond
      - name: Start app
        working-directory: ./app
        run: |
          npm run dev &
          npx wait-on http://localhost:3000 --timeout 90000

      # 7. Run tests inside the Playwright container (auto-pulls image if needed)
      - name: Run tests in Docker
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/work \
            -w /work \
            --network=host \
            --ipc=host \
            mcr.microsoft.com/playwright:v1.59.1-noble \
            npx playwright test

      # 8. Upload HTML report
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # 9. Upload raw test artifacts (ignore quietly if none, e.g. all passed)
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore